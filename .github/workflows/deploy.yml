name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests (Dependabot's included) get the same build and check, but never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job gets Pages write access.
permissions:
  contents: read

# Deploys queue one at a time; a new push to a PR cancels that PR's older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preview build (pathPrefix /Website/, noindex). To go live on www.assetas.com, set SITE_ENV: production here.
      - run: npm run build
      # Block the deploy on broken internal links/assets or sideways scrolling on phones.
      # The dev server serves _site with the same extensionless URLs as Pages.
      # On www.assetas.com the path prefix goes away: change --base to http://localhost:8080/.
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Check links and mobile layout
        run: |
          npx @11ty/eleventy --serve --port 8080 > serve.log 2>&1 &
          server=$!
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:8080/Website/ && break; sleep 1; done
          npm run check -- --base http://localhost:8080/Website/ || { cat serve.log; exit 1; }
          kill $server
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
