version: 2
updates:
  # Build tooling (Eleventy, Playwright, sharp). Grouped so routine bumps arrive as one PR a week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Actions used by .github/workflows/deploy.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
